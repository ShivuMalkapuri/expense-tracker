<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker - Set Monthly Budget</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body>

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-4" style="max-width: 550px;">

    <div class="card shadow border-0 rounded-3 bg-white">
        <div class="card-header bg-dark text-white p-3">
            <h4 class="fw-bold mb-0"><i class="fa-solid fa-piggy-bank me-2"></i> Set Monthly Budget Target</h4>
        </div>
        <div class="card-body p-4">
            <p class="text-muted">Define your maximum monthly budget limit. The dashboard will track your spending against this target in real-time.</p>
            <form th:action="@{/budget/set}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark fs-5">Monthly Budget Limit (₹)</label>
                    <input type="number" step="any" min="1" name="monthlyLimit" th:value="${monthlyLimit}" class="form-control form-control-lg fw-bold text-primary fs-3" required autofocus>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a href="/" class="btn btn-outline-secondary px-4"><i class="fa-solid fa-arrow-left me-1"></i> Cancel</a>
                    <button type="submit" class="btn btn-dark fw-bold px-5 btn-lg"><i class="fa-solid fa-check me-2"></i> Update Budget</button>
                </div>
            </form>
        </div>
    </div>

</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>

</body>
</html>
